  Handles canvas animation, cycle tracking, and user controls for mindfulness practice

<!-- ══ BREATHING EXERCISE ════════════════════════════════════════
     Drop into breathing.css for custom styling.
     Requires no external dependencies.
════════════════════════════════════════════════════════════════ -->

<div class="br-root">

    <!-- Pattern selector -->
    <div class="br-tabs" role="tablist" aria-label="Breathing pattern">
        <button class="br-tab active" data-pattern="478"    role="tab" aria-selected="true">4-7-8 Relaxation</button>
        <button class="br-tab"        data-pattern="box"    role="tab" aria-selected="false">Box (4-4-4-4)</button>
        <button class="br-tab"        data-pattern="calm"   role="tab" aria-selected="false">Calm (4-6)</button>
    </div>

    <!-- Canvas + overlay text -->
    <div class="br-canvas-wrap" aria-live="polite" aria-atomic="true">
        <canvas id="brCircle" width="240" height="240" aria-hidden="true"></canvas>
        <div class="br-center-text">
            <div class="br-phase" id="brPhase">Ready</div>
            <div class="br-count" id="brCount">—</div>
        </div>
    </div>

    <!-- Start / Reset -->
    <div class="br-controls">
        <button class="br-btn br-btn--primary" id="brStart">Start</button>
        <button class="br-btn"                 id="brReset" hidden>Reset</button>
    </div>

    <!-- Cycle tracker -->
    <div class="br-cycle-info">
        <div class="br-cycle-label" id="brCycleLabel">Cycles: 0</div>
        <div class="br-dots" id="brDots" aria-hidden="true"></div>
    </div>

    <!-- Contextual tip -->
    <p class="br-tip" id="brTip">
        A natural tranquilizer for the nervous system.
    </p>

</div>

<script>
(function () {

    /* ── Patterns ─────────────────────────────────────────────── */
    /**
     * Configuration object for breathing patterns
     * @property {Object} 478 - 4-7-8 Relaxation pattern
     * @property {Object} box - Box breathing (4-4-4-4) pattern
     * @property {Object} calm - Calm breathing (4-6) pattern
     * Each pattern contains: phases (array of label/secs), totalCycles, and tip text
     */
    var PATTERNS = {
        '478': {
            phases: [
                { label: 'Inhale', secs: 4 },
                { label: 'Hold',   secs: 7 },
                { label: 'Exhale', secs: 8 }
            ],
            totalCycles: 4,
            tip: 'Inhale 4 sec \u00b7 hold 7 sec \u00b7 exhale 8 sec. A natural tranquilizer for the nervous system.'
        },
        'box': {
            phases: [
                { label: 'Inhale', secs: 4 },
                { label: 'Hold',   secs: 4 },
                { label: 'Exhale', secs: 4 },
                { label: 'Hold',   secs: 4 }
            ],
            totalCycles: 4,
            tip: 'Equal sides, equal calm. Used to build focus and reduce stress under pressure.'
        },
        'calm': {
            phases: [
                { label: 'Inhale', secs: 4 },
                { label: 'Exhale', secs: 6 }
            ],
            totalCycles: 6,
            tip: 'Simple and effective. A longer exhale activates the parasympathetic nervous system.'
        }
    };

    /* ── DOM references ───────────────────────────────────────── */
    /** @type {HTMLCanvasElement} Canvas element for drawing the breathing circle */
    var canvas     = document.getElementById('brCircle');
    /** @type {CanvasRenderingContext2D} 2D rendering context for the canvas */
    var ctx        = canvas.getContext('2d');
    /** @type {HTMLElement} Element displaying current breathing phase label */
    var phaseEl    = document.getElementById('brPhase');
    /** @type {HTMLElement} Element displaying countdown seconds */
    var countEl    = document.getElementById('brCount');
    /** @type {HTMLElement} Start/Restart button element */
    var startBtn   = document.getElementById('brStart');
    /** @type {HTMLElement} Reset button element */
    var resetBtn   = document.getElementById('brReset');
    /** @type {HTMLElement} Element showing completed cycle count */
    var cycleLabel = document.getElementById('brCycleLabel');
    /** @type {HTMLElement} Container for cycle indicator dots */
    var dotsEl     = document.getElementById('brDots');
    /** @type {HTMLElement} Element displaying pattern tip text */
    var tipEl      = document.getElementById('brTip');

    /* ── Application state ────────────────────────────────────── */
    /** @type {Object} Currently selected breathing pattern configuration */
    var pat        = PATTERNS['478'];
    /** @type {boolean} Whether animation loop is currently running */
    var running    = false;
    /** @type {number|null} RequestAnimationFrame ID for canceling animation */
    var raf        = null;
    /** @type {number} Index of current phase within the pattern */
    var phaseIndex = 0;
    /** @type {number} Number of completed breathing cycles */
    var cyclesDone = 0;
    /** @type {number|null} Timestamp when current phase started (for timing) */
    var phaseStart = null;

    /* ── Canvas drawing constants ─────────────────────────────── */
    /** @type {number} Canvas center X coordinate */
    var CX = 120;
    /** @type {number} Canvas center Y coordinate */
    var CY = 120;
    /** @type {number} Radius of the main track circle */
    var R = 90;
    /** @type {number} Width of the track ring in pixels */
    var TRACK_W = 12;

    /**
     * Color mapping for each breathing phase (MMC green palette)
     * @type {Object<string, string>}
     */
    var PHASE_COLORS = {
        'Inhale': '#2c5f2e',   /* forest green */
        'Hold'  : '#3a6186',   /* slate blue   */
        'Exhale': '#5c4a7f'    /* soft purple  */
    };

    /* ── Helper functions ─────────────────────────────────────── */

    /**
     * Retrieves a CSS custom property value from the document root
     * @param {string} name - The CSS variable name (e.g., '--color-primary')
     * @returns {string} The trimmed value of the CSS variable, or '#ccc' as fallback
     */
    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#ccc';
    }

    /**
     * Calculates the inner bubble radius based on breathing phase and progress
     * @param {string} label - Current phase label ('Inhale', 'Hold', or 'Exhale')
     * @param {number} progress - Animation progress from 0.0 to 1.0
     * @returns {number} Calculated radius between 28px (min) and 70px (max)
     */
    function innerR(label, progress) {
        var lo = 28, hi = 70;
        if (label === 'Inhale') return lo + (hi - lo) * progress;
        if (label === 'Exhale') return lo + (hi - lo) * (1 - progress);
        return (lo + hi) / 2;
    }

    /* ── Drawing functions ────────────────────────────────────── */

    /**
     * Draws the breathing animation frame on canvas
     * @param {number} progress - Current phase progress (0.0 to 1.0)
     * @param {number} phaseIdx - Index of current phase in pattern.phases array
     * @returns {void}
     */
    function draw(progress, phaseIdx) {
        ctx.clearRect(0, 0, 240, 240);
        var phase  = pat.phases[phaseIdx % pat.phases.length];
        var color  = PHASE_COLORS[phase.label] || '#2c5f2e';
        var track  = 'rgba(0,0,0,0.08)';

        /* Track ring (background) */
        ctx.beginPath();
        ctx.arc(CX, CY, R, 0, Math.PI * 2);
        ctx.strokeStyle = track;
        ctx.lineWidth   = TRACK_W;
        ctx.stroke();

        /* Progress arc (active phase indicator) */
        var start = -Math.PI / 2;
        ctx.beginPath();
        ctx.arc(CX, CY, R, start, start + progress * Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth   = TRACK_W;
        ctx.lineCap     = 'round';
        ctx.stroke();

        /* Breathing bubble (expands/contracts with breath) */
        var bR = innerR(phase.label, progress);
        ctx.beginPath();
        ctx.arc(CX, CY, bR, 0, Math.PI * 2);
        ctx.fillStyle = color + '28';
        ctx.fill();
    }

    /**
     * Draws the idle state canvas (no animation, static ring + center dot)
     * @returns {void}
     */
    function drawIdle() {
        ctx.clearRect(0, 0, 240, 240);
        var track = 'rgba(0,0,0,0.08)';
        ctx.beginPath();
        ctx.arc(CX, CY, R, 0, Math.PI * 2);
        ctx.strokeStyle = track;
        ctx.lineWidth   = TRACK_W;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(CX, CY, 36, 0, Math.PI * 2);
        ctx.fillStyle = track;
        ctx.fill();
    }

    /* ── Cycle indicator functions ────────────────────────────── */

    /**
     * Builds the cycle indicator dots based on current pattern's totalCycles
     * @returns {void}
     */
    function buildDots() {
        dotsEl.innerHTML = '';
        for (var i = 0; i < pat.totalCycles; i++) {
            var d = document.createElement('div');
            d.className = 'br-dot';
            dotsEl.appendChild(d);
        }
    }

    /**
     * Updates the visual state of cycle indicator dots (done/current/pending)
     * @returns {void}
     */
    function updateDots() {
        var dots = dotsEl.querySelectorAll('.br-dot');
        dots.forEach(function (d, i) {
            d.classList.remove('done', 'current');
            if (i < cyclesDone)              d.classList.add('done');
            else if (i === cyclesDone && running) d.classList.add('current');
        });
    }

    /* ── Animation loop ───────────────────────────────────────── */

    /**
     * Animation frame callback that updates phase timing, UI, and canvas drawing
     * @param {number} ts - Current timestamp from requestAnimationFrame (milliseconds)
     * @returns {void}
     */
    function tick(ts) {
        if (!phaseStart) phaseStart = ts;
        var phase   = pat.phases[phaseIndex];
        var elapsed = (ts - phaseStart) / 1000;
        var progress = Math.min(elapsed / phase.secs, 1);
        var remaining = Math.max(Math.ceil(phase.secs - elapsed), 0);

        phaseEl.textContent = phase.label;
        countEl.textContent = remaining;
        draw(progress, phaseIndex);

        if (elapsed >= phase.secs) {
            phaseIndex++;
            phaseStart = ts;

            if (phaseIndex >= pat.phases.length) {
                phaseIndex = 0;
                cyclesDone++;
                cycleLabel.textContent = 'Cycles: ' + cyclesDone;
                updateDots();
                if (cyclesDone >= pat.totalCycles) { finish(); return; }
            }
        }
        raf = requestAnimationFrame(tick);
    }

    /* ── Control functions ────────────────────────────────────── */

    /**
     * Starts or restarts the breathing exercise animation
     * @returns {void}
     */
    function start() {
        running    = true;
        phaseIndex = 0;
        cyclesDone = 0;
        phaseStart = null;
        cycleLabel.textContent = 'Cycles: 0';
        buildDots();
        updateDots();
        startBtn.hidden = true;
        resetBtn.hidden = false;
        raf = requestAnimationFrame(tick);
    }

    /**
     * Resets the component to initial idle state, canceling any running animation
     * @returns {void}
     */
    function reset() {
        if (raf) cancelAnimationFrame(raf);
        running    = false;
        phaseIndex = 0;
        cyclesDone = 0;
        phaseStart = null;
        phaseEl.textContent    = 'Ready';
        countEl.textContent    = '—';
        cycleLabel.textContent = 'Cycles: 0';
        startBtn.textContent   = 'Start';
        startBtn.hidden        = false;
        resetBtn.hidden        = true;
        buildDots();
        drawIdle();
    }

    /**
     * Handles completion of all breathing cycles, updates UI to finished state
     * @returns {void}
     */
    function finish() {
        running = false;
        phaseEl.textContent  = 'Done';
        countEl.textContent  = '✓';
        startBtn.textContent = 'Restart';
        startBtn.hidden      = false;
        updateDots();
    }

    /* ── Event listeners ──────────────────────────────────────── */

    startBtn.addEventListener('click', function () {
        if (raf) cancelAnimationFrame(raf);
        start();
    });

    resetBtn.addEventListener('click', reset);

    document.querySelectorAll('.br-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            if (raf) cancelAnimationFrame(raf);
            document.querySelectorAll('.br-tab').forEach(function (t) {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            pat = PATTERNS[tab.dataset.pattern];
            tipEl.textContent = pat.tip;
            reset();
        });
    });

    /* ── Initialization ───────────────────────────────────────── */
    buildDots();
    drawIdle();

}());
</script>
